name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; never cancel one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm

      - uses: actions/configure-pages@v5
        id: pages

      - name: Install
        run: npm ci

      # The same gates as CI. A deploy must never be able to publish something
      # that would have failed a pull request.
      - name: Check formatting
        run: npm run format:check

      - name: Validate content
        run: npm run content:validate

      - name: Build content
        run: npm run content:build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        env:
          # configure-pages resolves the real base path from the repository's Pages
          # settings, so a rename or a move to a custom domain needs no code change.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test the deployment
        # Post-deployment verification: the site must actually serve, and a deep
        # link must survive the 404 fallback. A green deploy step alone does not
        # prove either of those.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Testing $PAGE_URL"

          # -L throughout: Pages 301-redirects a directory URL to its canonical
          # trailing-slash form (/about -> /about/). That redirect is correct
          # behaviour, so the assertion is on where you END UP, not the first hop.
          home_status=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$PAGE_URL")
          echo "  home            -> $home_status"
          [ "$home_status" = "200" ] || { echo "::error::Home page returned $home_status"; exit 1; }

          about_status=$(curl -sSL -o /dev/null -w '%{http_code}' "${PAGE_URL}about")
          echo "  /about          -> $about_status"
          [ "$about_status" = "200" ] || { echo "::error::Deep link /about returned $about_status"; exit 1; }

          # A 200 alone does not prove pre-rendering worked — the SPA fallback can
          # also produce a page that eventually renders. What proves it is that
          # /about serves the real app HTML and NOT the redirector.
          if curl -sSL "${PAGE_URL}about" | grep -q 'encodeFallbackUrl'; then
            echo "::error::/about served the SPA redirector, so it was not pre-rendered"
            exit 1
          fi
          echo "  /about          -> pre-rendered app HTML (not the redirector)"

          # An unknown/dynamic path must serve the SPA fallback rather than
          # GitHub's generic 404. Pages returns HTTP 404 with that body, which is
          # correct and is what makes deep links work — assert on body, not status.
          if ! curl -sS "${PAGE_URL}definitely-not-a-real-route" | grep -q 'encodeFallbackUrl'; then
            echo "::error::Unknown route did not serve the SPA fallback page"
            exit 1
          fi
          echo "  unknown route   -> SPA fallback served"

          # The bundle must be reachable at the base path. A wrong base is the
          # classic Pages failure: the HTML loads and the page renders blank.
          asset=$(curl -sSL "$PAGE_URL" | grep -oE '/[^"]*/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::No JS asset reference found in the served HTML"; exit 1; }
          origin=$(printf '%s' "$PAGE_URL" | sed -E 's|^(https?://[^/]+).*|\1|')
          asset_status=$(curl -sSL -o /dev/null -w '%{http_code}' "${origin}${asset}")
          echo "  $asset -> $asset_status"
          [ "$asset_status" = "200" ] || { echo "::error::JS bundle returned $asset_status (base path wrong?)"; exit 1; }

          echo "Smoke test passed."
